<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دخول ❤️</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    linear-gradient(
      rgba(8,5,10,.55),
      rgba(8,5,10,.9)
    ),
    url("images/cover.jpg")
    center/cover no-repeat;
}

.card{

  width:min(420px,94%);

  padding:38px 25px;

  text-align:center;

  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.12),
      rgba(255,255,255,.045)
    );

  border:
    1px solid
    rgba(255,255,255,.18);

  backdrop-filter:blur(22px);

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.55);

  animation:show .8s ease;
}

.heart{
  font-size:55px;
  margin-bottom:15px;
  animation:beat 1.7s infinite;
}

h1{
  font-size:29px;
  margin-bottom:10px;
}

p{
  font-size:12px;
  line-height:1.8;
  color:rgba(255,255,255,.6);
  margin-bottom:25px;
}

.inputBox{
  position:relative;
  margin-bottom:13px;
}

input{

  width:100%;
  height:54px;

  padding:0 18px 0 52px;

  border-radius:18px;

  border:
    1px solid
    rgba(255,255,255,.15);

  outline:none;

  background:
    rgba(0,0,0,.28);

  color:white;

  text-align:center;

  font-size:15px;

  direction:ltr;
}

input:focus{

  border-color:
    rgba(255,155,187,.7);

  box-shadow:
    0 0 25px
    rgba(233,87,139,.15);
}

input::placeholder{
  color:rgba(255,255,255,.35);
}

#eye{

  position:absolute;

  left:9px;
  top:50%;

  transform:translateY(-50%);

  width:38px;
  height:38px;

  border:0;

  border-radius:12px;

  background:
    rgba(255,255,255,.07);

  color:white;

  font-size:18px;

  cursor:pointer;
}

button.login{

  width:100%;
  height:52px;

  border:0;

  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      #e9578b,
      #9b365d
    );

  color:white;

  font-size:15px;

  font-weight:bold;

  cursor:pointer;

  box-shadow:
    0 12px 30px
    rgba(233,87,139,.25);

  transition:.2s;
}

button.login:active{
  transform:scale(.97);
}

#error{

  min-height:22px;

  margin-top:13px;

  color:#ff9bbb;

  font-size:12px;

  opacity:0;
}

#error.show{

  opacity:1;

  animation:shake .35s ease;
}

@keyframes show{

  from{
    opacity:0;
    transform:
      translateY(30px)
      scale(.96);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }
}

@keyframes beat{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.12);
  }
}

@keyframes shake{

  0%,100%{
    transform:translateX(0);
  }

  25%{
    transform:translateX(-7px);
  }

  75%{
    transform:translateX(7px);
  }
}

</style>
</head>

<body>

<div class="card">

  <div class="heart">
    ❤️
  </div>

  <h1>
    عمر & بسملة
  </h1>

  <p>
    المكان ده ليه كلمة سر خاصة بينا...
    <br>
    اكتبها عشان تدخل حكايتنا ❤️
  </p>

  <div class="inputBox">

    <input
      type="password"
      id="password"
      placeholder="اكتب كلمة السر"
      autocomplete="off">

    <button
      type="button"
      id="eye">
      👁️
    </button>

  </div>

  <button
    class="login"
    id="login">
    دخول ❤️
  </button>

  <div id="error">
    مش دي كلمة السر اللي متفقين عليها 😐
  </div>

</div>

<script>

const correctPassword = "Basmala";

const password =
document.getElementById("password");

const login =
document.getElementById("login");

const eye =
document.getElementById("eye");

const error =
document.getElementById("error");


eye.onclick = function(){

  if(password.type === "password"){

    password.type = "text";

    eye.textContent = "🙈";

  }else{

    password.type = "password";

    eye.textContent = "👁️";

  }

};


function checkPassword(){

  const value =
    password.value.trim();

  if(value === correctPassword){

    sessionStorage.setItem(
      "omarBasmalaLogin",
      "true"
    );

    window.location.href =
      "index.html";

  }else{

    error.classList.add("show");

    password.value = "";

    password.focus();

  }

}


login.onclick =
  checkPassword;


password.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){
      checkPassword();
    }

  }
);

</script>

</body>
</html>
